name: C3 catalog

on:
  push:
    branches: [main, develop]
    paths: ["data/**", "docs/c3-*.md", ".github/workflows/catalog.yml"]
  pull_request:
    branches: [main, develop]
    paths: ["data/**", "docs/c3-*.md", ".github/workflows/catalog.yml"]

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catalog (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run C3 tests without third-party packages
        env:
          PYTHONUTF8: "1"
        run: python -S -W error -m unittest discover -s data/tests -p test_catalog.py -v
