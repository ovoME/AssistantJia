services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xiaojia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - chroma
    networks:
      - xiaojia-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xiaojia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - xiaojia-net

  redis:
    image: redis:7-alpine
    container_name: xiaojia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - xiaojia-net

  chroma:
    image: chromadb/chroma:latest
    container_name: xiaojia-chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - xiaojia-net

volumes:
  redis-data:
  chroma-data:

networks:
  xiaojia-net:
    driver: bridge
